name: nexvia-genai-01

services:
  qdrant:
    image: qdrant/qdrant:v1.16.0
    container_name: nexvia-genai-01-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexvia-genai-01-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      SQLITE_PATH: /srv/app/data/nexvia_rag.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - api_data:/srv/app/data
    depends_on:
      - qdrant

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexvia-genai-01-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  qdrant_data:
  api_data:
